<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث القرمزي - عالم الدراما التركية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0b0b; /* خلفية داكنة جدا وفخمة */
            font-family: sans-serif;
            color: white;
        }
        .main-wrapper {
            text-align: center;
            width: 90%;
            max-width: 650px;
        }
        .logo-section {
            margin-bottom: 35px;
        }
        .logo-section img {
            max-width: 320px; /* حجم الشعار */
            height: auto;
            /* تأثير اضاءة خفيف خلف الشعار */
            filter: drop-shadow(0 0 15px rgba(229, 9, 20, 0.2));
        }
        .search-area {
            position: relative;
            background: #1a1a1a;
            border-radius: 50px;
            padding: 5px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            transition: 0.3s ease;
        }
        .search-area:hover, .search-area:focus-within {
            border-color: #e50914;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
            background: #222;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 25px;
            color: white;
            font-size: 18px;
            outline: none;
            text-align: right;
        }
        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-left: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #ff0f1b;
            transform: scale(1.02);
        }
        .info-text {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
        .links {
            margin-top: 15px;
        }
        .links a {
            color: #e50914;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
            opacity: 0.8;
        }
        .links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="logo-section">
        <img src="kirmzi.tv.PNG" alt="القرمزي">
    </div>

    <form action="https://kirmzi.tv/" method="GET" id="searchForm">
        <div class="search-area">
            <input type="text" name="s" placeholder="ابحث عن مسلسلاتك المفضلة..." required>
            <button type="submit">بحث</button>
        </div>
    </form>

    <div class="info-text">
        البحث يشمل كافة حلقات وافلام موقع <span style="color: #e50914;">القرمزي</span>
    </div>
    
    <div class="links">
        <a href="https://kirmzi.tv/">الرئيسية</a>
        <a href="https://kirmzi.tv/category/مسلسلات-تركية/">مسلسلات تركية</a>
        <a href="https://kirmzi.tv/category/افلام-تركية/">افلام تركية</a>
    </div>
</div>

<script>
    document.getElementById('searchForm').onsubmit = function(e) {
        var query = this.querySelector('input[name="s"]').value;
        if(query) {
            // توجيه البحث لموقعك الاصلي
            window.location.href = "https://kirmzi.tv/?s=" + encodeURIComponent(query);
            return false; 
        }
    };
</script>

</body>
</html>
