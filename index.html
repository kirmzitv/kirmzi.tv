<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث القرمزي - بحث احترافي</title>
    <style>
        /* تنسيق الصفحة الاساسي */
        body {
            margin: 0; padding: 0; display: flex; justify-content: center;
            align-items: center; height: 100vh; background-color: #0d0d0d;
            font-family: sans-serif; color: white;
        }
        .main-wrapper { text-align: center; width: 90%; max-width: 600px; }
        
        .logo-section { margin-bottom: 40px; }
        .logo-section img { max-width: 300px; height: auto; }

        /* تصميم صندوق البحث اليدوي (بدون تدخل جوجل) */
        .search-container { position: relative; width: 100%; }
        
        .custom-search-bar {
            display: flex; align-items: center; background: #1a1a1a;
            border-radius: 50px; padding: 5px 15px; border: 1px solid #333;
            transition: 0.3s ease;
        }
        .custom-search-bar:focus-within {
            border-color: #e50914;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        input#userQuery {
            flex: 1; background: transparent; border: none; padding: 15px;
            color: white; font-size: 18px; outline: none; text-align: right;
        }

        /* زر البحث الاحمر الصغير */
        .search-btn {
            background: #e50914; border: none; color: white;
            padding: 10px 25px; border-radius: 40px; cursor: pointer;
            font-weight: bold; font-size: 16px;
        }

        /* قائمة الاقتراحات المنسدلة */
        .results-box {
            position: absolute; top: 110%; left: 0; right: 0;
            background: #1a1a1a; border: 1px solid #333; border-radius: 15px;
            display: none; z-index: 1000; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .result-item {
            padding: 12px 20px; text-align: right; cursor: pointer;
            border-bottom: 1px solid #222; color: #ccc; transition: 0.2s;
        }
        .result-item:hover { background: #e50914; color: white; }

        /* اخفاء محرك بحث جوجل الاصلي تماما */
        #hiddenGcse { display: none; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="logo-section">
        <img src="kirmzi.tv.PNG" alt="القرمزي">
    </div>

    <div class="search-container">
        <div class="custom-search-bar">
            <input type="text" id="userQuery" placeholder="ماذا تريد ان تشاهد اليوم؟" autocomplete="off">
            <button class="search-btn" id="goSearch">بحث</button>
        </div>
        <div id="results" class="results-box"></div>
    </div>

    <div style="margin-top: 30px; color: #444; font-size: 14px;">
        محرك بحث خاص بموقع kirmzi.tv
    </div>
</div>

<div id="hiddenGcse">
    <script async src="https://cse.google.com/cse.js?cx=3722f7c69721340db"></script>
    <div class="gcse-search"></div>
</div>

<script>
    const input = document.getElementById('userQuery');
    const resultsBox = document.getElementById('results');
    const btn = document.getElementById('goSearch');

    // وظيفة للبحث عند ضغط الزر او Enter
    const performSearch = () => {
        const q = input.value;
        if(q) window.location.href = `https://kirmzi.tv/?s=${encodeURIComponent(q)}`;
    };

    btn.onclick = performSearch;
    input.onkeypress = (e) => { if(e.key === 'Enter') performSearch(); };

    // جلب الاقتراحات باستخدام JSONP لتفادي مشاكل التصميم
    input.oninput = function() {
        const q = this.value;
        if(q.length < 2) { resultsBox.style.display = 'none'; return; }

        const script = document.createElement('script');
        script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=site:kirmzi.tv ${q}&callback=handleSuggest`;
        document.body.appendChild(script);
        document.body.removeChild(script);
    };

    window.handleSuggest = (data) => {
        const suggestions = data[1];
        if(suggestions.length > 0) {
            resultsBox.innerHTML = '';
            suggestions.slice(0, 5).forEach(s => {
                const item = s.replace('site:kirmzi.tv', '').trim();
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerText = item;
                div.onclick = () => {
                    input.value = item;
                    performSearch();
                };
                resultsBox.appendChild(div);
            });
            resultsBox.style.display = 'block';
        } else {
            resultsBox.style.display = 'none';
        }
    };

    // اغلاق الاقتراحات عند الضغط خارجا
    document.onclick = (e) => { if(!e.target.closest('.search-container')) resultsBox.style.display = 'none'; };
</script>

</body>
</html>
