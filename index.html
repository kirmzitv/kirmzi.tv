<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث القرمزي - مسلسلات وافلام تركية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .search-container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            max-width: 280px; /* حجم الشعار */
            height: auto;
            filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.3));
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px; /* حواف دائرية اكثر احترافية */
            border: 2px solid #e50914;
            background: #1a1a1a;
            color: white;
            font-size: 18px;
            outline: none;
            transition: 0.4s;
            padding-left: 100px; /* مساحة للزر */
        }
        input[type="text"]:focus {
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            background: #222;
        }
        button {
            position: absolute;
            left: 8px;
            background: #e50914;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #b20710;
            transform: scale(1.05);
        }
        .footer-text {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .highlight {
            color: #e50914;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="search-container">
    <div class="logo">
        <img src="https://kirmzi.tv/wp-content/uploads/2023/12/logo-kirmzi.png" alt="شعار القرمزي">
    </div>

    <form action="https://kirmzi.tv/" method="GET" id="searchForm">
        <div class="search-box">
            <input type="text" name="s" placeholder="ابحث عن مسلسلك المفضل..." required>
            <button type="submit">ابحث الان</button>
        </div>
    </form>

    <div class="footer-text">
        محرك بحث خاص بموقع <span class="highlight">القرمزي</span> للمسلسلات التركية
    </div>
</div>

<script>
    document.getElementById('searchForm').onsubmit = function() {
        var query = this.querySelector('input[name="s"]').value;
        if(query) {
            // التوجيه المباشر لنتائج البحث في موقعك
            window.location.href = "https://kirmzi.tv/?s=" + encodeURIComponent(query);
            return false;
        }
    };
</script>

</body>
</html>
