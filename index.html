<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث القرمزي - عالم المسلسلات التركية</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center;
            align-items: center; height: 100vh; background-color: #0b0b0b;
            font-family: sans-serif; color: white;
        }
        .main-wrapper { text-align: center; width: 90%; max-width: 600px; }
        .logo-section { margin-bottom: 30px; }
        .logo-section img { max-width: 280px; height: auto; }

        /* تخصيص شكل محرك بحث جوجل ليكون احترافيا */
        .gcse-searchbox-only { margin-top: 20px; }
        
        /* تحسين شكل صندوق البحث */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }
        .gsc-search-button-v2 {
            background-color: #e50914 !important;
            border-radius: 20px !important;
            border: none !important;
            padding: 10px 20px !important;
        }
        input.gsc-input {
            background: #1a1a1a !important;
            border: 1px solid #333 !important;
            border-radius: 25px !important;
            color: white !important;
            padding: 10px 15px !important;
            font-size: 16px !important;
        }
        input.gsc-input:focus {
            border-color: #e50914 !important;
        }

        /* تعديل شكل الاقتراحات لتظهر مثل جوجل تماما */
        .gstl_50.gssb_c { z-index: 9999 !important; text-align: right !important; }
        .gssb_m { 
            background: #1a1a1a !important; 
            color: white !important; 
            border: 1px solid #333 !important;
            border-radius: 0 0 15px 15px !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5) !important;
        }
        .gssb_a td { background: #222 !important; color: #e50914 !important; cursor: pointer; }
        
        .footer-note { margin-top: 40px; color: #555; font-size: 13px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="logo-section">
        <img src="kirmzi.tv.PNG" alt="القرمزي">
    </div>

    <script async src="https://cse.google.com/cse.js?cx=3722f7c69721340db"></script>
    <div class="gcse-searchbox-only" data-resultsUrl="https://kirmzi.tv/"></div>

    <div class="footer-note">
        جميع حقوق المحتوى محفوظة لموقع <span style="color: #e50914;">القرمزي</span> 2026
    </div>
</div>

<script>
    // كود لتغيير نص المساعد داخل المربع وتعديل سلوك البحث
    window.onload = function() {
        const checkExist = setInterval(function() {
            const input = document.querySelector('input.gsc-input');
            if (input) {
                input.placeholder = "ابحث عن اي مسلسل او فيلم تركي...";
                clearInterval(checkExist);
            }
        }, 100);
    };
</script>

</body>
</html>
