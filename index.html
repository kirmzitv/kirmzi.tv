<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث القرمزي - بحث ذكي</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center;
            align-items: center; height: 100vh; background-color: #0b0b0b;
            font-family: sans-serif; color: white;
        }
        .main-wrapper { text-align: center; width: 90%; max-width: 600px; }
        .logo-section { margin-bottom: 30px; }
        .logo-section img { max-width: 280px; height: auto; }

        /* تخصيص محرك بحث جوجل ليتناسب مع تصميمك */
        .gcse-searchbox-only { margin-top: 20px; }
        
        /* اخفاء عناصر جوجل الاضافية للحفاظ على نظافة التصميم */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }
        input.gsc-input {
            background: #1a1a1a !important;
            border: 2px solid #333 !important;
            border-radius: 30px !important;
            color: white !important;
            padding: 12px 20px !important;
            font-size: 16px !important;
        }
        input.gsc-input:focus {
            border-color: #e50914 !important;
            outline: none !important;
        }
        .gsc-search-button-v2 {
            background-color: #e50914 !important;
            border-radius: 30px !important;
            padding: 10px 20px !important;
            border: none !important;
        }
        /* تعديل شكل قائمة الاقتراحات */
        .gstl_50.gssb_c { z-index: 9999 !important; text-align: right !important; }
        .gssb_m { background: #1a1a1a !important; color: white !important; border: 1px solid #333 !important; }
        .gssb_a td { background: #222 !important; color: #e50914 !important; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="logo-section">
        <img src="kirmzi.tv.PNG" alt="القرمزي">
    </div>

    <script async src="https://cse.google.com/cse.js?cx=8456108420e6e4f3a"></script>
    <div class="gcse-searchbox-only" data-resultsUrl="https://kirmzi.tv/"></div>

    <div style="margin-top: 30px; color: #666; font-size: 14px;">
        ابحث عن الحلقات والافلام المترجمة في موقع <span style="color: #e50914;">القرمزي</span>
    </div>
</div>

<script>
    // كود اضافي لتحسين توجيه البحث لموقعك مباشرة
    window.onload = function() {
        const interval = setInterval(() => {
            const searchInput = document.querySelector('input.gsc-input');
            if (searchInput) {
                searchInput.placeholder = "ابحث عن مسلسلك المفضل...";
                clearInterval(interval);
            }
        }, 500);
    };
</script>

</body>
</html>
